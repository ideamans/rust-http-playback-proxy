name: Unit Tests

on:
  push:
    branches:
      - develop
  # Without this the unit tests, the reference drift check and the plugin
  # validation never run on a pull request — the guards exist but nothing
  # triggers them.
  pull_request:

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # llmdocs/90-commands.md is committed because include_str! needs a real
      # file at build time, so the guard against drift is regenerating it here.
      - name: Regenerate the embedded command catalog
        run: cargo run --bin http-playback-proxy -- llm --regenerate

      - name: Fail if the committed reference is stale
        run: |
          if ! git diff --exit-code -- llmdocs; then
            echo "::error::llmdocs is out of date. Run 'cargo run --bin http-playback-proxy -- llm --regenerate' and commit the result."
            exit 1
          fi

      - name: Verify the llm subcommand renders
        run: |
          cargo run --bin http-playback-proxy -- llm | head -5
          cargo run --bin http-playback-proxy -- llm --format json | head -5


      - name: Run tests
        run: cargo test
